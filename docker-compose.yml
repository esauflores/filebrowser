services:
  filebrowser:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ${FILES_DIR}:/srv
      - filebrowser-data:/database
      - filebrowser-config:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

volumes:
  filebrowser-data:

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    volumes:
      - ${FILES_DIR}:/srv
      - filebrowser-data:/database
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

volumes:
  filebrowser-data:
